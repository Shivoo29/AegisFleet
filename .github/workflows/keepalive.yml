# Render's free web service sleeps after 15 minutes without traffic, and the first visit
# after that waits ~50 s. GitHub delays short cron runs by hours, so one run stays up for
# ~5h45m pinging /healthz every 4 minutes, then dispatches the next run (GITHUB_TOKEN may
# trigger workflow_dispatch). The hourly cron restarts the chain if a run ever dies.
# ponytail: UptimeRobot or a paid Render instance if this chain ever breaks.
name: keep-alive

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Ping /healthz every 4 minutes for ~5h45m
        run: |
          end=$((SECONDS + 345 * 60))
          while [ $SECONDS -lt $end ]; do
            curl -fsS --max-time 90 --retry 2 https://aegisfleet.solvor.co.in/healthz || echo "ping failed"
            echo
            sleep 240
          done
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run keepalive.yml --repo "${{ github.repository }}" --ref main
