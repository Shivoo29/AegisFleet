# Self-hosted deploy: app + Postgres + Cloudflare Tunnel. No ports opened on the server.
# Run on the server:  docker compose -f docker-compose.prod.yml up -d --build
# Needs .env next to this file (see DEPLOY.md), including CLOUDFLARE_TUNNEL_TOKEN.
services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://aegis:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/aegis
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: aegis
    volumes: [aegis_prod_db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on: [app]
    restart: unless-stopped

volumes:
  aegis_prod_db:
