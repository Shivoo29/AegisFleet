services:
  - type: web
    name: aegisfleet
    env: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aegisfleet-db
          property: connectionString
      - key: PAYPAL_MODE
        value: fake
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: LLM_PROVIDER
        value: fake
      - key: LLM_MODEL
        sync: false
      - key: LLM_FALLBACKS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: AGENTS_ENABLED
        value: collector,sentinel,guardian,defender
      - key: APPROVAL_THRESHOLD_CENTS
        value: "10000"
      - key: KILL_SWITCH
        value: "false"
      - key: CONSOLE_PASSWORD
        sync: false
      - key: DEMO_MODE
        value: "true"
    healthCheckPath: /healthz
    autoDeploy: true

databases:
  - name: aegisfleet-db
    databaseName: aegis
    user: aegis
    plan: free
    ipAllowList: []