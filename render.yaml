services:
  - type: web
    name: aegisfleet
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aegisfleet-db
          property: connectionString
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_FALLBACKS
        value: gemini:gemini-3.5-flash,nvidia:nvidia/nemotron-3.5-super-vl-120b-a12b
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: AGENTS_ENABLED
        value: collector,sentinel,guardian,defender
      - key: APPROVAL_THRESHOLD_CENTS
        value: "10000"
      - key: KILL_SWITCH
        value: "false"
      - key: CONSOLE_PASSWORD
        sync: false
      - key: JUDGE_PASSWORD
        sync: false
      - key: DEMO_MODE
        value: "true"
    healthCheckPath: /healthz
    autoDeploy: true

databases:
  - name: aegisfleet-db
    databaseName: aegis
    user: aegis
    plan: free
    region: singapore
    ipAllowList: []